name: Update feeds

on:
  schedule:
    # Hourly at :17 past the hour (offset from :00 to avoid GitHub's peak-load minute)
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit updated feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update feed data [skip ci]"
            git push
          fi
